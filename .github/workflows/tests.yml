name: Test Suites

# We are a reusable Workflow only
on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

env:
  MODULE_ID: ${{ github.event.repository.name }}
  GRADLE_VERSION: 9.6.1

jobs:
  tests:
    name: "OS: ${{ matrix.os }} with JDK: ${{ matrix.jdkVersion }}, Exp: ${{ matrix.experimental }}"
    runs-on: ${{ matrix.os }}
    env:
      DB_USER: root
      DB_PASSWORD: root
      # Gate + connection details for the standalone Postgres/MariaDB ORM boot smoke tests.
      ORM_TEST_POSTGRES: "true"
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_DB: ormtest
      PG_USER: postgres
      PG_PASSWORD: postgres
      ORM_TEST_MARIADB: "true"
      MARIADB_HOST: 127.0.0.1
      # 3307 on the host to avoid colliding with the systemctl-managed MySQL on 3306.
      MARIADB_PORT: 3307
      MARIADB_DB: ormtest
      MARIADB_USER: root
      MARIADB_PASSWORD: root
    continue-on-error: ${{ matrix.experimental }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ormtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ormtest
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"] # "windows-latest"
        jdkVersion: ["21"]
        boxlangVersion: [ "1.13.0" ]
        experimental: [false]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5.3.0
        with:
          distribution: "temurin"
          java-version: ${{ matrix.jdkVersion }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Database and Fixtures
        run: |
          sudo systemctl start mysql.service
          mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e "set global sql_mode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION';"
          mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e 'CREATE DATABASE test;'
          mysql -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }} -e 'CREATE DATABASE dsn2;'

      - name: Test Module
        run: |
          gradle installModuleDependencies --stacktrace --console=plain -PboxlangVersion="${{ matrix.boxlangVersion }}"
          # this is done in order to build the module structure before testing
          gradle shadowJar test --stacktrace --console=plain -PboxlangVersion="${{ matrix.boxlangVersion }}"

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@v6.4.1
        if: always()
        with:
          report_paths: |
            **/build/test-results/test/*.xml
            **/surefire-reports/*.xml
            **/failsafe-reports/*.xml
          check_name: "JUnit Report ${{ matrix.os }}-${{ matrix.jdkVersion }}"
          include_passed: false
          fail_on_failure: true
          summary: "Test Results for ${{ matrix.os }} on JDK ${{ matrix.jdkVersion }}"
          detailed_summary: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-${{ matrix.jdkVersion }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

      - name: Inform Slack
        if: ${{ !matrix.experimental && failure() && github.ref == 'refs/heads/development' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: boxlang
          SLACK_COLOR: ${{ job.status }} # or a specific color like 'green' or '#ff00ff'
          SLACK_ICON_EMOJI: ":bell:"
          SLACK_MESSAGE: "${{ env.MODULE_ID }} Tests FAILED!  You broke the build! :("
          SLACK_TITLE: "${{ env.MODULE_ID }} Build Failure"
          SLACK_USERNAME: CI
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          MSG_MINIMAL: true
