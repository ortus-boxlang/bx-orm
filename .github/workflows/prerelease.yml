# Manual pre-release of the `next` branch (2.0.0-beta.1, 2.0.0-beta.2, ...) for external testing.
# Run it from Actions > "Pre-Release (next)" > Run workflow, on the `next` branch.
# It runs the tests, builds with the pre-release version, uploads to downloads.ortussolutions.com and ForgeBox,
# tags the commit and creates a GitHub pre-release. It never touches the changelog, development or the stable release.
name: Pre-Release (next)

on:
    workflow_dispatch:
        inputs:
            label:
                description: "Pre-release label"
                required: true
                default: "beta"
                type: choice
                options:
                    - alpha
                    - beta
                    - rc

# One pre-release at a time, so two runs can never pick the same number
concurrency:
    group: prerelease-${{ github.repository }}
    cancel-in-progress: false

env:
    MODULE_ID: ${{ github.event.repository.name }}
    JDK: 21
    BUILD_ID: ${{ github.run_number }}
    # Any branch but development keeps the version as is (no -snapshot) in build.gradle
    BRANCH: next

jobs:
    #############################################
    # Only the next branch can be pre-released
    #############################################
    guard:
        name: Check Branch
        runs-on: ubuntu-latest
        steps:
            - name: Require the next branch
              if: github.ref != 'refs/heads/next'
              run: |
                  echo "::error::Pre-releases are built from the next branch only (this run is on ${{ github.ref_name }})."
                  exit 1

    #############################################
    # Tests first: no green tests, no pre-release
    #############################################
    tests:
        needs: guard
        uses: ./.github/workflows/tests.yml
        secrets: inherit
        permissions:
            checks: write
            pull-requests: write
            contents: read
            issues: read

    #############################################
    # Build & publish the pre-release
    #############################################
    build:
        name: Build & Publish Pre-Release
        needs: tests
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup CommandBox
              uses: Ortus-Solutions/setup-commandbox@v2.0.1
              with:
                  forgeboxAPIKey: ${{ secrets.FORGEBOX_API_TOKEN }}

            - name: Setup Java
              uses: actions/setup-java@v6
              with:
                  distribution: "temurin"
                  java-version: ${{ env.JDK }}

            - name: Setup Gradle
              uses: gradle/gradle-build-action@v3

            # The next free number for this label, from the existing tags: v2.0.0-beta.1, v2.0.0-beta.2 -> 2.0.0-beta.3
            - name: Compute Pre-Release Version
              run: |
                  BASE=$(grep '^version=' gradle.properties | cut -d'=' -f2 | sed 's/-.*$//')
                  LABEL="${{ inputs.label }}"
                  git fetch --tags --force --quiet
                  LAST=$(git tag -l "v${BASE}-${LABEL}.*" | sed -E "s/^v${BASE}-${LABEL}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
                  NUMBER=$(( ${LAST:-0} + 1 ))
                  VERSION="${BASE}-${LABEL}.${NUMBER}"
                  echo "VERSION=${VERSION}" >> $GITHUB_ENV
                  echo "Pre-release version: ${VERSION}"
                  # Build with it (not committed)
                  sed -i "s/^version=.*/version=${VERSION}/" gradle.properties

            - name: Build it!
              run: |
                  ./gradlew downloadBoxLang
                  ./gradlew build -x test --stacktrace --console=plain

            - name: Upload Distributions to S3
              uses: jakejarvis/s3-sync-action@master
              with:
                  args: --acl public-read
              env:
                  AWS_S3_BUCKET: "downloads.ortussolutions.com"
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
                  SOURCE_DIR: "build/distributions"
                  DEST_DIR: "ortussolutions/boxlang-modules/${{ env.MODULE_ID }}/${{ env.VERSION }}"

            - name: Upload API Docs to S3
              uses: jakejarvis/s3-sync-action@master
              with:
                  args: --acl public-read
              env:
                  AWS_S3_BUCKET: "apidocs.ortussolutions.com"
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
                  SOURCE_DIR: "build/docs/javadoc"
                  DEST_DIR: "boxlang-modules/${{ env.MODULE_ID }}/${{ env.VERSION }}"

            - name: Publish to ForgeBox
              run: |
                  cd build/module
                  cat box.json
                  box forgebox publish --force
                  cd $GITHUB_WORKSPACE

            - name: Tag the Pre-Release
              run: |
                  git config user.name "Github Actions"
                  git config user.email "info@ortussolutions.com"
                  git tag -a "v${VERSION}" -m "Pre-release v${VERSION}" "$GITHUB_SHA"
                  git push origin "v${VERSION}"

            # Release notes: the [Unreleased] section of the changelog, plus how to install
            - name: Create GitHub Pre-Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  {
                    echo "Pre-release of ${MODULE_ID} ${VERSION} for testing. Not for production."
                    echo ""
                    echo "Install: \`box install ${MODULE_ID}@${VERSION}\`"
                    echo ""
                    awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found' changelog.md
                  } > .prerelease-notes.md
                  gh release create "v${VERSION}" --prerelease --title "${VERSION}" --notes-file .prerelease-notes.md

            - name: Inform Slack
              if: ${{ always() }}
              uses: rtCamp/action-slack-notify@v2
              env:
                  SLACK_CHANNEL: coding
                  SLACK_COLOR: ${{ job.status }}
                  SLACK_ICON_EMOJI: ":bell:"
                  SLACK_MESSAGE: "Module ${{ env.MODULE_ID }} pre-release v${{ env.VERSION }} built with ${{ job.status }}!"
                  SLACK_TITLE: "BoxLang Module ${{ env.MODULE_ID }}"
                  SLACK_USERNAME: CI
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
