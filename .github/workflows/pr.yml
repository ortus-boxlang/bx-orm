name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "releases/v*"
  pull_request:
    branches:
      - "releases/v*"
      - development

jobs:
  tests:
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Format PR
  format_check:
    name: Checks Source Code Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21

      - name: Verify Code Formatting
        run: ./gradlew spotlessCheck

      # Pinned so CI formats exactly like the version the test app was formatted with. 1.18.0 (the
      # module's build version) has an older formatter without --check, --source dirs or --excludes.
      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@1.6.0
        with:
          version: 1.19.0

      - name: Format BoxLang Source
        # StaticThing.bx is excluded: the formatter drops the `static` modifier from its
        # `static function count()`, which the static-methods tests depend on.
        run: boxlang format --check --source ./src/test/resources/app --excludes ./src/test/resources/app/models/StaticThing.bx
