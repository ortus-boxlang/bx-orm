name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "releases/v*"
  pull_request:
    branches:
      - "releases/v*"
      - development

jobs:
  tests:
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Format PR
  format_check:
    name: Checks Source Code Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21

      - name: Verify Code Formatting
        run: ./gradlew spotlessCheck

      # Pinned to the BoxLang version the module builds against (gradle.properties), so the formatter matches local runs.
      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@1.6.0
        with:
          version: 1.18.0

      - name: Format BoxLang Source
        # StaticThing.bx is excluded: the BoxLang 1.18.0 formatter drops the `static` modifier from its `static function`,
        # which would change what the static entity method tests test.
        run: boxlang format --check --source ./src/test/resources/app --excludes ./src/test/resources/app/models/StaticThing.bx
