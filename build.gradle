// https://docs.gradle.org/current/userguide/building_java_projects.html#sec:java_packaging
plugins {
    id 'java'
    // For source code formatting
    id "com.diffplug.spotless" version "8.10.0"
	// https://github.com/harbby/gradle-serviceloader
    id "com.github.harbby.gradle.serviceloader" version "1.1.9"
	// Shadow
	id "com.gradleup.shadow" version "9.6.1"
    // Download task
    id "de.undercouch.download" version "5.7.0"
}

/**
 * Project Properties
 */
ext {
	buildID = System.getenv( 'BUILD_ID' ) ?: '0'
	branch = System.getenv( 'BRANCH' ) ?: 'development'
	testResourceDirectory = 'src/test/resources';
}

if ( branch == 'development' ) {
	// If the branch is 'development', ensure the version ends with '-snapshot'
	// This replaces any existing prerelease identifier with '-snapshot'
	version = version.contains('-') ? version.replaceAll(/-.*/, '-snapshot') : "${version}-snapshot"
	// NOTE: boxlangVersion is pinned to an explicit BoxLang release (see gradle.properties); it is used verbatim and
	// is intentionally NOT snapshot-ified here, so the same release resolves on development and feature branches alike.
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
	// BoxLang Runtime
	if ( file( "../boxlang/build/libs/boxlang-${boxlangVersion}.jar" ).exists() ) {
		// Run against a local BoxLang build
		// You must run `./gradle build -x test` in the BoxLang project
		compileOnly files( "../boxlang/build/libs/boxlang-${boxlangVersion}.jar" )
		testImplementation files( "../boxlang/build/libs/boxlang-${boxlangVersion}.jar" )
	} else if ( file( "src/test/resources/libs/boxlang-${boxlangVersion}.jar" ).exists() ) {
		// Downloaded Dependencies
		compileOnly files( "src/test/resources/libs/boxlang-${boxlangVersion}.jar" )
		testImplementation files( "src/test/resources/libs/boxlang-${boxlangVersion}.jar" )
	}

	// Implementation Dependencies
	// https://mvnrepository.com/artifact/org.hibernate.orm/hibernate-core
	implementation 'org.hibernate.orm:hibernate-core:' + hibernateVersion
	// https://mvnrepository.com/artifact/org.hibernate/hibernate-jcache
	implementation 'org.hibernate.orm:hibernate-jcache:' + hibernateVersion
	// ByteBuddy: used to generate real Java "facade" classes per ORM entity at runtime (pinned to Hibernate's version).
	// Hibernate already bundles it transitively; declared explicitly since the module now uses it directly.
	implementation 'net.bytebuddy:byte-buddy:1.18.8'
	// Community dialects (SQLite, legacy versioned dialects, etc.)
	implementation 'org.hibernate.orm:hibernate-community-dialects:' + hibernateVersion
	// hibernate-models is only a runtime dependency of hibernate-core, but BootstrapContext exposes its ModelsContext type,
	// so our delegating BootstrapContext needs it on the compile classpath.
	implementation 'org.hibernate.models:hibernate-models:1.1.2'
	// https://mvnrepository.com/artifact/javax.cache/cache-api
	implementation 'javax.cache:cache-api:1.1.1'
	// https://mvnrepository.com/artifact/org.ehcache/ehcache
	implementation 'org.ehcache:ehcache:3.12.0'

    // Testing Dependencies
    // Pinning this because the next version up breaks our tests
    testImplementation "org.junit.jupiter:junit-jupiter:6.+"
	testImplementation "org.mockito:mockito-core:5.+"
	testImplementation "com.google.truth:truth:1.+"
	// SQLite JDBC driver, used to test ORM boot against a SQLite datasource
	// https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc
	testImplementation "org.xerial:sqlite-jdbc:3.53.4.0"
	// Apache Derby (embedded), used for an in-memory ORM boot + CRUD smoke test
	testImplementation "org.apache.derby:derby:10.16.1.1"
	testImplementation "org.apache.derby:derbyshared:10.16.1.1"
	testImplementation "org.apache.derby:derbytools:10.16.1.1"
	// PostgreSQL JDBC driver, used for a CI-gated ORM boot + CRUD smoke test
	testImplementation "org.postgresql:postgresql:42.7.4"
	// MariaDB JDBC driver, used for a CI-gated ORM boot + CRUD smoke test
	testImplementation "org.mariadb.jdbc:mariadb-java-client:3.4.1"
	// Explicitly declare the JUnit platform launcher (to avoid deprecation)
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// ==========================================================================
// JMH performance benchmark suite
// --------------------------------------------------------------------------
// Benchmarks ORM boot, entity CRUD, and HQL throughput against an embedded Derby
// datasource. The module (and therefore Hibernate) is loaded in its own isolated
// classloader from a module path, so the benchmark's own classpath needs only the
// BoxLang runtime, JMH, and the JDBC driver (copied into build/module/libs by
// copyTestJdbcDrivers) - exactly like the standalone boot tests.
//
// The module path is swappable via -Dorm.module.path=<dir> so the same benchmarks
// run against the current build (build/module, Hibernate 7) and a downloaded prior
// release (Hibernate 5) for a before/after comparison.
// ==========================================================================
sourceSets {
	jmh {
		java.srcDir 'src/jmh/java'
		resources.srcDir 'src/jmh/resources'
	}
}

// NOTE: jmhImplementation deliberately does NOT extend testImplementation (which transitively
// extends implementation and would leak Hibernate onto the benchmark's outer classpath). The
// benchmark must mirror production: only BoxLang + JMH + the module's own compiled classes on the
// outer classpath, with Hibernate loaded solely inside the module's isolated classloader. That
// keeps the Hibernate 5 vs Hibernate 7 comparison honest.
dependencies {
	jmhImplementation sourceSets.main.output
	jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
	jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
	if ( file( "../boxlang/build/libs/boxlang-${boxlangVersion}.jar" ).exists() ) {
		jmhImplementation files( "../boxlang/build/libs/boxlang-${boxlangVersion}.jar" )
	} else if ( file( "src/test/resources/libs/boxlang-${boxlangVersion}.jar" ).exists() ) {
		jmhImplementation files( "src/test/resources/libs/boxlang-${boxlangVersion}.jar" )
	}
}

task jmh( type: JavaExec, dependsOn: [ 'jmhClasses', 'copyTestJdbcDrivers' ] ) {
	group = "verification"
	description = "Run the JMH ORM performance benchmarks against the current build (Hibernate 7)"
	mainClass = 'org.openjdk.jmh.Main'
	classpath = sourceSets.jmh.runtimeClasspath
	// Pass through JMH args, e.g: ./gradlew jmh -PjmhArgs="-f 1 -wi 2 -i 3"
	if ( project.hasProperty( 'jmhArgs' ) ) {
		args( project.property( 'jmhArgs' ).toString().split( '\\s+' ) )
	}
}

// --------------------------------------------------------------------------
// Before/after comparison: Hibernate 7 (current build) vs Hibernate 5 (last 5.x
// release, 1.7.0). The 1.7.0 module is a self-contained shadow jar; we only add a
// JDBC driver to its libs so it can reach the embedded Derby datasource.
// Each version is benchmarked in its own forked JVM (a single JVM cannot host both
// shaded Hibernate versions), then the JSON results are printed side by side.
//   ./gradlew jmhCompare                       # default rigor
//   ./gradlew jmhCompare -PperfForks=1 -PperfWarmup=1 -PperfIterations=2   # quick
// --------------------------------------------------------------------------
task perfDownloadHib5( type: Download ) {
	src "https://downloads.ortussolutions.com/ortussolutions/boxlang-modules/bx-orm/1.7.0/bx-orm-1.7.0.zip"
	dest "build/perf/bx-orm-1.7.0.zip"
	overwrite false
	onlyIfModified true
}

task perfSetupHib5( type: Copy, dependsOn: [ perfDownloadHib5, 'copyTestJdbcDrivers' ] ) {
	from zipTree( "build/perf/bx-orm-1.7.0.zip" )
	into "build/perf/hib5-module"
	// Add the Derby driver to the old module's isolated libs so it can connect.
	into( 'libs' ) {
		from configurations.testRuntimeClasspath.filter { it.name.startsWith( 'derby' ) }
	}
}

def perfForks		= ( project.findProperty( 'perfForks' )			?: '2' ).toString()
def perfWarmup		= ( project.findProperty( 'perfWarmup' )		?: '3' ).toString()
def perfIterations	= ( project.findProperty( 'perfIterations' )	?: '5' ).toString()

def perfArgs = { modulePath, jsonOut ->
	[ 'ortus.boxlang.modules.orm.perf',
		'-f', perfForks, '-wi', perfWarmup, '-i', perfIterations, '-r', '2', '-w', '2',
		'-jvmArgsAppend', "-Dorm.module.path=${file( modulePath ).absolutePath}",
		'-rf', 'json', '-rff', jsonOut ]
}

task perfBenchHib7( type: JavaExec, dependsOn: [ 'jmhClasses', 'copyTestJdbcDrivers' ] ) {
	mainClass	= 'org.openjdk.jmh.Main'
	classpath	= sourceSets.jmh.runtimeClasspath
	args		= perfArgs( 'build/module', "${buildDir}/perf/hib7.json" )
	doFirst { file( "${buildDir}/perf" ).mkdirs() }
}

task perfBenchHib5( type: JavaExec, dependsOn: [ 'jmhClasses', perfSetupHib5 ] ) {
	mainClass	= 'org.openjdk.jmh.Main'
	classpath	= sourceSets.jmh.runtimeClasspath
	args		= perfArgs( 'build/perf/hib5-module', "${buildDir}/perf/hib5.json" )
	doFirst { file( "${buildDir}/perf" ).mkdirs() }
}

task jmhCompare( dependsOn: [ perfBenchHib7, perfBenchHib5 ] ) {
	group = "verification"
	description = "Benchmark Hibernate 7 (current) vs Hibernate 5 (1.7.0) and print a comparison"
	doLast {
		def slurper	= new groovy.json.JsonSlurper()
		def h7		= slurper.parse( file( "${buildDir}/perf/hib7.json" ) )
		def h5		= slurper.parse( file( "${buildDir}/perf/hib5.json" ) )
		def scoreOf	= { data, bench -> data.find { it.benchmark.endsWith( bench ) }?.primaryMetric?.score }
		def benches	= ( h7*.benchmark.collect { it.tokenize( '.' ).last() } ).unique()

		println "\n================ Hibernate 5 (1.7.0) vs Hibernate 7 (current) ================"
		printf( "%-18s %16s %16s %12s%n", 'Benchmark', 'Hib5 (us/op)', 'Hib7 (us/op)', 'Hib7 speedup' )
		benches.each { b ->
			def s5 = scoreOf( h5, b )
			def s7 = scoreOf( h7, b )
			def delta = ( s5 && s7 ) ? String.format( '%.1f%%', ( s5 - s7 ) / s5 * 100 ) : 'n/a'
			printf( '%-18s %16.2f %16.2f %12s%n', b, ( s5 ?: 0 ), ( s7 ?: 0 ), delta )
		}
		println "(lower us/op = faster; positive speedup = Hibernate 7 is faster)"
		println "Full JSON: ${buildDir}/perf/hib5.json , ${buildDir}/perf/hib7.json"
	}
}

// Exclude main resources from IDE classpath to avoid class loading conflicts
// Resources are still included in the JAR/build outputs
sourceSets {
	main {
		resources {
			// Empty the resources to exclude from IDE classpath
			srcDirs = []
		}
	}
}

java {
	// Set Java version compatibility, Gradle 9-style.
	sourceCompatibility = jdkVersion
	targetCompatibility = jdkVersion
    // Produces a javadocs jar
	withJavadocJar()
}

compileJava {
	// Compiler Options
	options.incremental = true
	options.encoding = 'UTF-8'
	options.debug = true
}

compileTestJava{
	// Make sure the service loaders are created before testing
	dependsOn compileJava, serviceLoaderBuild
}
compileTestJava.finalizedBy( shadowJar )

/**
 * Clean up
 */
clean {
	doLast{
		var userDir = file( "${System.getProperty('user.home')}/.boxlang/classes" )
		if ( userDir.exists() ) {
			userDir.deleteDir()
			println "+ Cleared user home classes " + userDir.toString()
		}
		println "+ Clean finalized!"
	}
}

javadoc {
    // To avoid our own doclet issues
	options.addBooleanOption( "Xdoclint:none", true )
	//exclude '**/boxlang/parser/**'
	options.addBooleanOption( 'html5', true )
}
task zipJavadocs( type: Zip ) {
	group = "documentation"
	from javadoc.destinationDir
	archiveFileName = "${project.name}-javadocs-${version}.zip"
	destinationDirectory = file( "$buildDir/distributions" )
	// Output that the docs have been zippped
	doLast {
		println "+ Javadocs have been zipped to the distribution folder"
	}
}
javadoc.finalizedBy( zipJavadocs )

/**
 * Docs are here:
 * - https://github.com/harbby/gradle-serviceloader,
 * - https://plugins.gradle.org/plugin/com.github.harbby.gradle.serviceloader
 * This generates the META-INF/services files for the ServiceLoader as part of the `build` task
 */
serviceLoader {
    serviceInterface 'ortus.boxlang.runtime.bifs.BIF'
    serviceInterface 'ortus.boxlang.runtime.components.Component'
    serviceInterface 'ortus.boxlang.runtime.async.tasks.IScheduler'
    serviceInterface 'ortus.boxlang.runtime.cache.providers.ICacheProvider'
	serviceInterface 'ortus.boxlang.runtime.events.IInterceptor'
	serviceInterface 'ortus.boxlang.runtime.services.IService'
}

jar {
    archiveVersion =  "${version}"
 	manifest {
	   attributes 'Description': 'BoxLang ORM'
    }
}
shadowJar {
	archiveClassifier = ""
    mergeServiceFiles()
    destinationDirectory = file( "build/libs" )
}

/**
 * Source Code Formatting
 */
spotless {
    java {
		target fileTree( "." ) {
            include "**/*.java"
            exclude "**/build/**", "bin/**", "examples/**"
        }
        eclipse().configFile( "./.ortus-java-style.xml" )
		toggleOffOn()
    }
}

/**
 * Custom task that creates a build/module folders
 * - Copies the build/libs/BoxLangModuleTemplate-1.0.0.jar to build/module/libs/BoxLangModuleTemplate-1.0.0.jar
 * - Copies the src/main/bx/** to build/module/ folder.
 */
task createModuleStructure(type: Copy) {
	mustRunAfter shadowJar, jar
    from( 'build/libs' ) {
		include "${project.name}-${version}.jar"
        into 'libs'
    }
    from( 'src/main/bx' ) {
		include '**/*.bx'
		// Token Replacements Go Here
		filter { line -> line.replaceAll('@build.hibernateVersion@', hibernateVersion) }
		filter{ line -> line.replaceAll( '@build.version@', project.version ) }
		if( project.branch == "development" ){
			filter{ line -> line.replaceAll( '\\+@build.number@', '' ) }
		} else {
			filter{ line -> line.replaceAll( '@build.number@', project.buildID ) }
		}
    }
    from( '.' ) {
        include 'box.json'
		include 'readme.md'
		include 'changelog.md'
		// Token Replacements Go Here
		filter{ line -> line.replaceAll( '@build.version@', project.version ) }
		if( project.branch == "development" ){
			filter{ line -> line.replaceAll( '\\+@build.number@', '' ) }
		} else {
			filter{ line -> line.replaceAll( '@build.number@', project.buildID ) }
		}
    }

    destinationDir = file( 'build/module' )
}
task zipModuleStructure( type: Zip ) {
    group = "distribution"
    from createModuleStructure.destinationDir
    archiveFileName = "${project.name}-${version}.zip"
    destinationDirectory = file( "$buildDir/distributions" )
    // Output that the module has been zippped
    doLast {
        println "+ Module has been zipped to the distribution folder"
    }
}
createModuleStructure.finalizedBy( zipModuleStructure )
shadowJar.finalizedBy( createModuleStructure )

/**
 * The ORM module runs in its own isolated classloader (only what's bundled into `build/module/libs`),
 * so a JDBC driver added as a plain `testImplementation` dependency is invisible to it: `DriverManager`
 * refuses to hand out a driver to a caller outside its loading classloader's lineage.
 * This copies test-only JDBC driver jars (not shipped in the module's distribution zip, since it
 * runs after `zipModuleStructure`) into the live `build/module/libs` folder so ORM tests that need a
 * real JDBC connection (e.g. SQLite) can resolve their driver.
 */
task copyTestJdbcDrivers( type: Copy, dependsOn: createModuleStructure ) {
	// Must run after the module zip is built, so the test-only driver never ends up in the
	// distributed module zip (only in the live build/module folder used by the test harness).
	mustRunAfter zipModuleStructure
	from configurations.testRuntimeClasspath.filter { jar ->
		[ 'sqlite-jdbc', 'derby', 'postgresql', 'mariadb-java-client' ].any { jar.name.startsWith( it ) }
	}
	into 'build/module/libs'
}

/**
 * Removes the test-only driver jar(s) copied in by `copyTestJdbcDrivers` once tests are done.
 * `build/module` is not cleaned between separate Gradle invocations, so without this, a later
 * packaging task (e.g. `zipModuleStructure`) run in the same workspace without a `clean` in
 * between could pick up the leftover test-only driver and ship it in the distribution zip.
 */
task removeTestJdbcDrivers( type: Delete ) {
	delete fileTree( 'build/module/libs' ) {
		include 'sqlite-jdbc-*.jar'
		include 'derby-*.jar'
		include 'derbyshared-*.jar'
		include 'derbytools-*.jar'
		include 'postgresql-*.jar'
		include 'mariadb-java-client-*.jar'
	}
}
test.finalizedBy( removeTestJdbcDrivers )

test {
	dependsOn copyTestJdbcDrivers
	useJUnitPlatform()
	testLogging {
		showStandardStreams = true
	}
	classpath = classpath.filter { !it.path.contains( "build${File.separator}resources" ) }
}

/**
 * TEMPORARY until we publish to maven
 * Task to download the latest jar from https://ortus-temp.s3.amazonaws.com/jericho/libs/boxlang-1.0.0.jar
 */
task downloadBoxLang( type: Download ) {
	// Create the destination directory
	doFirst {
		file( "src/test/resources/libs" ).mkdirs()
	}
    // Configure the URL of the file to download
	src([
		"https://downloads.ortussolutions.com/ortussolutions/boxlang/${boxlangVersion}/boxlang-${boxlangVersion}.jar",
		"https://downloads.ortussolutions.com/ortussolutions/boxlang-modules/bx-mysql/${mysqlVersion}/bx-mysql-${mysqlVersion}.zip"
	])
    // Specify the destination directory for the downloaded files
    dest "src/test/resources/libs/"
    overwrite true
    onlyIfModified false
}

task downloadDocGenerator( type: Download ) {
	// Create the destination directory
	doFirst {
		file( "build/resources/libs" ).mkdirs()
	}
    // Configure the URL of the file to download
    src "https://downloads.ortussolutions.com/ortussolutions/boxlang-runtimes/boxlang-doc-generator/1.0.0-snapshot/boxlang-doc-generator-1.0.0-snapshot.jar"
    // Specify the destination directory for the downloaded file
    dest "build/resources/libs/boxlang-doc-generator-1.0.0-snapshot.jar"
    overwrite true
    onlyIfModified false
}
/**
 * Generate/Scaffold technical documentation
 */
task generateTechnicalDocumentation( type: Javadoc ) {
	source = sourceSets.main.java
	dependsOn downloadDocGenerator, compileJava, serviceLoaderBuild
	def classPaths = new ArrayList<File>( sourceSets.main.runtimeClasspath.getFiles() )
	classPaths.addAll( sourceSets.main.java.getFiles() )
	classPaths.addAll( configurations.compileClasspath.getFiles() )
	classPaths.addAll( files( 'build/resources/libs/boxlang-doc-generator-1.0.0-snapshot.jar' ) )
	options.classpath( classPaths )
    classpath = sourceSets.main.allJava
	options.addBooleanOption( "Xdoclint:none", true )
	exclude '**/boxlang/parser/**'
	options.addBooleanOption( 'html5', true )
	options.doclet = "ortus.boxlang.tools.doclets.BoxLangDoclet"
    options.docletpath = classPaths
}

/**
 * Install any dependencies the module needs
 */
task installModuleDependencies( dependsOn: downloadBoxLang, type: Copy ) {
	from zipTree( file( "${testResourceDirectory}/libs/bx-mysql-${mysqlVersion}.zip" ) )
	into "${testResourceDirectory}/modules/bx-mysql"
}

/**
 * Project Wide Helper function
 * This is not a task, but a reusable UDF
 */
project.ext.bumpVersion = { boolean major = false, boolean minor = false, boolean patch = false ->

	def propertiesFile = file( './gradle.properties' );
	def properties = new Properties();

	properties.load( propertiesFile.newDataInputStream() )
	def versionTarget = major ? 0 : minor ? 1 : 2

	def currentVersion = properties.getProperty( 'version' )
	def versionParts = currentVersion.split( '\\.' )
	def newPathVersion = versionParts[ versionTarget ].toInteger() + 1
	def newVersion = '';

	if( patch ){
		newVersion = "${versionParts[ 0 ]}.${versionParts[ 1 ]}.${newPathVersion}"
	} else if( minor ){
		newVersion = "${versionParts[ 0 ]}.${newPathVersion}.${versionParts[ 2 ]}"
	} else if( major ){
		newVersion = "${newPathVersion}.${versionParts[ 1 ]}.${versionParts[ 2 ]}"
	}

	properties.setProperty( 'version', newVersion )
	properties.store( propertiesFile.newWriter(), null )

	println "Bumped version from ${currentVersion} to ${newVersion}"
}
/**
 * Bump the major version number
 */
task bumpMajorVersion {
	doLast{
		bumpVersion( true )
	}
}

/**
 * Bump the minor version number
 */
task bumpMinorVersion {
	doLast{
		bumpVersion( false, true )
	}
}

/**
 * Bump the patch version number
 */
task bumpPatchVersion {
	doLast{
		bumpVersion( false, false, true )
	}
}
